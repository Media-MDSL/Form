<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrated Engineering and Marine Electronics</title>
  <meta name="theme-color" content="#0B3460">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B3460;
      --navy-deep: #072447;
      --orange: #F58A07;
      --orange-light: #FFB347;
      --page: #EAF0F8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Montserrat", Arial, sans-serif;
      background-color: var(--page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      background-color: #ffffff;
      max-width: 1000px;
      width: 100%;
      height: 95vh;
      box-shadow: 0 4px 15px rgba(7, 36, 71, 0.18);
      border-radius: 10px;
      overflow: hidden;
    }

    .flyer {
      flex: 2;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    .flyer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .cta {
      flex: 1;
      background: linear-gradient(170deg, var(--navy) 0%, var(--navy-deep) 100%);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
    }

    .cta .confirm {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .cta .event {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--orange-light);
    }

    .cta .when {
      margin: 4px 0 0;
      font-size: 0.9rem;
    }

    .cta .note {
      margin: 14px 0 0;
      font-size: 0.82rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.82);
    }

    .cta hr {
      width: 56px;
      border: 0;
      border-top: 3px solid var(--orange);
      margin: 26px 0 22px;
    }

    .cta h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .cta a {
      background-color: var(--orange);
      color: var(--navy-deep);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 5px;
      font-weight: 700;
      transition: background-color 0.2s;
    }

    .cta a:hover {
      background-color: var(--orange-light);
    }

    .cta a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
      }

      .container {
        flex-direction: column;
        height: auto;
        border-radius: 0;
      }

      .cta {
        order: -1;
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="flyer">
      <img src="mdsl_latest.jpeg" alt="Multidigital Services Limited company flyer" />
    </div>
    <div class="cta">
      <hr>
      <h2>Want to know us more?</h2>
      <a href="https://multidigitalng.com/" target="_blank" rel="noopener">Click Here</a>
    </div>
  </div>

</body>
</html>
