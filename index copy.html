<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Smarter Navigation, Safer Seas | Multidigital Services Limited</title>
  <meta name="description" content="Register for Smarter Navigation, Safer Seas: Insights from Anschütz & Jotron. Virtual Webinar Series, 2nd edition, 11 November 2026 at 10:00 AM (WAT).">
  <meta property="og:title" content="Smarter Navigation, Safer Seas: Insights from Anschütz & Jotron">
  <meta property="og:description" content="Virtual Webinar Series, 2nd edition. 11 November 2026 at 10:00 AM (WAT). Register now.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0B3460">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container">

    <!-- Banner: edit the text below to change the event details -->
    <header class="banner">
      <svg class="banner-globe" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="globeClip"><circle cx="100" cy="100" r="96"/></clipPath>
          <linearGradient id="globeFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFB347"/>
            <stop offset="1" stop-color="#F58A07"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#globeClip)">
          <g transform="rotate(-28 100 100)" fill="url(#globeFill)">
            <rect x="-20" y="14"  width="240" height="30"/>
            <rect x="-20" y="52"  width="240" height="26"/>
            <rect x="-20" y="86"  width="240" height="22"/>
            <rect x="-20" y="116" width="240" height="17"/>
            <rect x="-20" y="141" width="240" height="12"/>
            <rect x="-20" y="161" width="240" height="8"/>
          </g>
        </g>
      </svg>

      <div class="banner-top">
        <div class="badge">
          <img src="mdsl_logo.png" alt="Multidigital Services Limited">
        </div>
        <div class="banner-title">
          <span class="series">Virtual Webinar Series, 2nd edition</span>
          <h1>Smarter Navigation,<br>Safer Seas</h1>
          <p class="sub">Insights from Anschütz &amp; Jotron</p>
        </div>
      </div>

      <ul class="chips">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          11 November 2026
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          10:00 AM (WAT)
        </li>
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          Online
        </li>
      </ul>

      <p class="banner-foot">Enquiries: info@multidigitalng.com</p>
    </header>

    <form id="registrationForm">
      <div class="heady">
        <div class="heady-strip"></div>
        <div class="heady-content">
          <h2>Register for the webinar</h2>
          <p class="heady-note">The access link will be shared with registered participants ahead of the event.</p>
        </div>
      </div>

      <div class="inputer">
        <label for="name">Name <span class="required">*</span></label>
        <input type="text" name="name" id="name" placeholder="your answer" autocomplete="name" required>
      </div>

      <div class="inputer">
        <label for="phone">Phone/Whatsapp Number <span class="required">*</span></label>
        <input type="tel" name="phone" id="phone" placeholder="your answer" autocomplete="tel" required>
      </div>

      <div class="inputer">
        <label for="company">Company <span class="required">*</span></label>
        <input type="text" name="company" id="company" placeholder="your answer" autocomplete="organization" required>
      </div>

      <div class="inputer">
        <label for="position">Position <span class="required">*</span></label>
        <input type="text" name="position" id="position" placeholder="your answer" autocomplete="organization-title" required>
      </div>

      <div class="inputer">
        <label for="email">Company Email <span class="required">*</span></label>
        <input type="email" name="email" id="email" placeholder="your answer" autocomplete="email" required>
      </div>

      <div class="inputer">
        <label for="linkedin">LinkedIn Profile</label>
        <input type="text" name="linkedin" id="linkedin" placeholder="your answer">
      </div>

      <div class="form-actions">
        <button type="submit">Register</button>
        <button type="reset" class="clear-btn">Clear form</button>
      </div>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
